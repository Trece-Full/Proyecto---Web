<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventos</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/eventos.css" />
</head>

<body>

  <div class="page-bg">
    <div class="container">
      <div class="page-header">
        <div class="page-header-title-row">
          <div class="accent-bar"></div>
          <h1>EVENTOS</h1>
        </div>
        <p class="subtitle">Calendario de actividades académicas, culturales y deportivas</p>
      </div>

      <div class="section">
        <h2 class="section-title">EVENTOS DESTACADOS</h2>
        <div class="featured-grid" id="featured-grid"></div>
      </div>

      <div>
        <div class="section-header-row">
          <h2 class="section-title">TODOS LOS EVENTOS</h2>
          <div class="filters" id="filters"></div>
        </div>
        <div class="event-list" id="event-list"></div>
      </div>

      <div class="section form-section">
        <details class="form-details">

          <summary class="form-summary">
            <span class="form-summary-icon">＋</span>
            <span>Agregar o editar evento</span>
          </summary>

          <form id="formulario-evento" class="event-form">
            <input type="hidden" id="evento-id" />

            <div class="form-row">
              <div class="form-field">
                <label for="evento-nombre">Nombre del evento</label>
                <input type="text" id="evento-nombre" required />
              </div>
              <div class="form-field">
                <label for="evento-tipo">Tipo</label>
                <select id="evento-tipo" required>
                  <option value="Competencia">Competencia</option>
                  <option value="Conferencia">Conferencia</option>
                  <option value="Taller">Taller</option>
                  <option value="Feria">Feria</option>
                  <option value="Seminario">Seminario</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="evento-fecha">Fecha</label>
                <input type="date" id="evento-fecha" required />
              </div>
              <div class="form-field">
                <label for="evento-hora">Horario</label>
                <input type="text" id="evento-hora" placeholder="9:00 AM - 1:00 PM" required />
              </div>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="evento-ubicacion">Ubicación</label>
                <input type="text" id="evento-ubicacion" required />
              </div>
              <div class="form-field">
                <label for="evento-organizador">Organizador</label>
                <input type="text" id="evento-organizador" required />
              </div>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="evento-cupos">Cupos</label>
                <input type="number" id="evento-cupos" min="1" required />
              </div>
              <div class="form-field">
                <label for="evento-imagen">URL de imagen</label>
                <input type="url" id="evento-imagen" placeholder="https://... (opcional)"/>
              </div>
            </div>

            <div class="form-field">
              <label for="evento-descripcion">Descripción</label>
              <textarea id="evento-descripcion" rows="3" required></textarea>
            </div>

            <label class="form-checkbox">
              <input type="checkbox" id="evento-destacado" />
              Mostrar en Eventos Destacados
            </label>

            <div class="form-actions">
              <button type="submit" class="btn-guardar">Guardar evento</button>
              <button type="button" id="btn-cancelar" class="btn-cancelar">Cancelar edición</button>
            </div>
          </form>
        </details>
      </div>
    </div>
  </div>

  <script src="../javascript/eventos.js"></script>
</body>

</html>
