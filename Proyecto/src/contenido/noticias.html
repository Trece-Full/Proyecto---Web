<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info.Estudiantil - Noticias</title>
  <link rel="stylesheet" href="styles_noticias.css">
</head>
<body>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="contenedor-principal">

    <!--  COLUMNA IZQUIERDA -->
    <div class="columna-izquierda">

      <!-- Noticia destacada -->
      <section class="hero" id="hero-destacada">
        <!-- El JS inserta aquí la noticia destacada -->
      </section>

      <!-- Todas las noticias -->
      <section class="ultimas-noticias">
        <h2>Todas las noticias</h2>
        <div class="grid-noticias" id="grid-noticias">
          <!-- El JS inserta aquí las tarjetas de noticias -->
        </div>
      </section>
    </div>

    <!-- COLUMNA DERECHA -->
    <aside class="columna-derecha">

      <!-- Lo más importante -->
      <section class="sidebar-card">
        <h3>Lo más importante</h3>
        <div id="lista-importantes">
          <!-- El JS inserta aquí avisos/eventos/convocatorias destacados -->
        </div>
        <a href="#" class="ver-todos">Ver todos los avisos →</a>
      </section>

      <!-- Próximos eventos -->
      <section class="sidebar-card">
        <h3>Próximos eventos</h3>
        <div id="lista-eventos">
          <!-- El JS inserta aquí los próximos eventos -->
        </div>
        <a href="#" class="ver-todos">Ver todos los eventos →</a>
      </section>
    </aside>
  </main>

  <!-- MODAL -->
  <div class="modal-fondo" id="modalFondo">
    <div class="modal-contenido">
      <button class="modal-cerrar" id="modalCerrar" aria-label="Cerrar">✕</button>
      <div id="modalImagen" class="modal-imagen"></div>
      <div class="modal-texto">
        <span class="categoria" id="modalCategoria"></span>
        <h2 id="modalTitulo"></h2>
        <span class="hora" id="modalTiempo"></span>
        <p id="modalCuerpo"></p>
      </div>
    </div>
  </div>

  <script src="script_noticias.js"></script>
</body>
</html>
